name: Build Extension APK

on:
  push:
    branches: [ "main", "master" ] # Sekarang jalan setiap kali kamu push, tidak perlu tag v1.0 dll
  workflow_dispatch: # Kamu bisa menjalankan ini secara manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.5.1

      - name: Build with Gradle
        run: gradle assembleRelease

      # LANGKAH PALING PENTING: Simpan APK sebagai Artifact agar bisa didownload langsung
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Extension-APK # Nama file zip yang akan muncul nanti
          path: |
            **/*.apk
