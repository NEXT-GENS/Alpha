name: Build and Release Extension

on:
  push:
    tags:
      - 'v*' # Jalan saat kamu buat tag v1.0, v1.1, dll

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # CARA A: Langsung panggil 'gradle' sistem, bukan './gradlew'
      - name: Build with Gradle
        run: gradle assembleRelease

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          # Mencari APK di folder build (path standar Android Gradle Plugin)
          find . -name "*.apk" -exec cp {} release-artifacts/extension-release.apk \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/extension-release.apk
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref }}
          body: "Otomatis di-build menggunakan Cara A. Versi: ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
