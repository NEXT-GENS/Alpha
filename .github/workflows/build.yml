name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # STEP BARU: Menginstal Android SDK agar Gradle tidak error "SDK not found"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Kita gunakan gradle-build-action untuk memastikan versi gradle kompatibel
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle
        run: gradle assembleRelease

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          find . -name "*.apk" -exec cp {} release-artifacts/extension-release.apk \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/extension-release.apk
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref }}
          body: "Build fixed with Android SDK setup. Versi: ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
