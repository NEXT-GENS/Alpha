name: Build and Release Extension

on:
  push:
    tags:
      - 'v*' # Workflow ini HANYA berjalan jika kamu membuat Tag yang diawali huruf 'v' (contoh: v1.0, v1.1)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # WAJIB: Memberikan izin kepada GitHub Action untuk membuat Release & upload file

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      # Langkah ini mencari file APK di folder build dan mengubah namanya menjadi simpel
      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/extension-release.apk

      # Menggunakan Action dari softprops untuk membuat GitHub Release secara otomatis
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/extension-release.apk
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref }}
          body: "Otomatis di-build oleh GitHub Actions. Versi: ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
